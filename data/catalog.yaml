# Data catalog — every upstream source the project downloads.
#
# scripts/fetch.py reads this file and downloads into data/raw/ (gitignored).
# scripts/build_attribution.py generates ATTRIBUTION.md from it.
#
# Fields
#   id        short key, used by fetch.py --only and by processing scripts
#   group     core | heavy | reference   (fetch.py fetches `core` by default)
#   licence   SPDX id where one exists
#   ship      true  = may appear in the shipped app (CC0 / CC BY / PD)
#             false = local development only (no stated licence) — see docs/plan/decisions.md D4
#   credit    the short credit line shown in the app's Credits panel
#   citation  full citation for ATTRIBUTION.md and the docs
#   files     url + path (relative to data/raw/) + size/md5 when the host publishes them
#             extract: glob(s) to unzip/untar next to the archive
#   queries   (PBDB) API requests saved as files; results change over time, so the fetch date is recorded
#
# Verified 2026-10-11 against the Zenodo / Dataverse / PANGAEA APIs (sizes and md5s are the hosts' own).

sources:

