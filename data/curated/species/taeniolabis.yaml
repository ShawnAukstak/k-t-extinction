# Species card. Field conventions: see the header of data/curated/fauna-regions.yaml.
# Early Paleocene (Danian) recovery animal: absent before the impact; it appears at `recovery.appears_years`.
id: taeniolabis
name: Taeniolabis
species: [T. taoensis]
# mammal_small is the app's only mammal body plan; it is used here for a ~35 kg animal.
group: mammal_small
body_plan: quadruped
age:
  formation: Denver Fm (Corral Bluffs, Colorado); Nacimiento Fm (San Juan Basin, New Mexico); a smaller species, T. lamberti, in the Puercan of Montana (Krause et al. 2021; PBDB)
  ma_range: [65.32, 65.03]
  latest_maastrichtian: false
  epoch: early Paleocene (Danian), late Puercan land-mammal age (Pu3)
  note: >-
    Its first appearance defines the start of the Pu3 interval zone (Lofgren et al. 2004, as used by Lyson et al. 2019
    and Krause et al. 2021). Range: first in-place find at Corral Bluffs (~65.32 Ma, GPTS 2012 age model) to the end
    of the San Juan Basin Pu3 faunas (65.03 Ma; Flynn et al. 2020).
regions: [hell-creek, south-laramidia]
size:
  length_m: {typical: 0.9, range: [0.8, 1.1], confidence: chosen, note: "head and body; scaled from a large beaver-like rodent; no skeleton-based length in our sources"}
  hip_height_m: 0.3
  hip_height_note: "estimated"
  mass_kg:
    value: 37
    range: [22, 65]
    source: krause2021
    confidence: model
    note: >-
      Krause et al. 2021, cranial-size regression (Kirk et al. 2014): 36.6 kg (DMNH EPV.95284; 95 % CI 22.4–59.9 kg)
      and 39.7 kg (AMNH 16321; 24.2–65.1 kg); Lyson et al. 2019 gave 34.0 kg (20.8–55.6 kg) for the first skull.
      Earlier estimates (reviewed by Krause et al.) ran from 7.7–19.4 kg (tooth-row length) to over 100 kg (molar
      area); Lyson et al. treat molar-based values for large multituberculates as overestimates.
appearance:
  integument: fur
  colour: unknown; the app uses a muted brown
  confidence: model
behaviour:
  group_size: {typical: [1, 2], confidence: chosen}
  diet: herbivore (Lyson et al. 2019)
  activity: [browse_low, walk, rest]
  speed_m_s: {walk: 0.5, max: 3.0, source: null, confidence: chosen}
  habitat_note: "found mostly in river-channel and crevasse-splay sandstones (5:1, n = 6), i.e. near river banks (Lyson et al. 2019)"
abundance:
  hell-creek: {relative: 0.08, source: lyson2019, confidence: chosen, note: "ordinal uncommon; six specimens at Corral Bluffs (Lyson et al. 2019; Krause et al. 2021 refer four of them); PBDB lists 4 Puercan occurrences of the genus in Montana"}
  south-laramidia: {relative: 0.08, source: pbdb, confidence: chosen, note: "ordinal uncommon; PBDB lists 6 Puercan occurrences in New Mexico and Utah"}
recovery:
  appears_years: 718000
  range_years: [623000, 730000]
  confidence: known
  source: lyson2019
  note: >-
    First in-place record at Corral Bluffs: a cranium 113.42 m above the boundary, 718 kyr after it on the GPTS 2012
    age model and 675 kyr on the Clyde et al. 2016 model (Lyson et al. 2019, data S11); Krause et al. 2021 give
    ~730 kyr for the lowest in-place specimen. A nearly complete skull found loose 6 m lower (676 kyr; 623 kyr on the
    Clyde model) had probably moved only a short way, so the boundary could be slightly lower. Fragments found lower
    still had probably rolled downslope.
  by_region:
    south-laramidia:
      appears_years: 770000
      range_years: [710000, 830000]
      confidence: model
      source: flynn2020
      note: >-
        San Juan Basin: the lowest Pu3 ('Taeniolabis zone') horizon is dated 65.27–65.22 Ma (±0.06 Myr; Flynn et al.
        2020), ~770–820 kyr after the impact.
sources: [lyson2019, krause2021, clyde2016, fuentes2019, flynn2020, pbdb]
notes: >-
  The largest known multituberculate, an extinct group of rodent-like mammals: about 35 kg. It was a plant-eater
  that lived near rivers and appears about 700,000 years after the impact, around the time the first bean-family
  plants show up in the same rocks.
