# Species card. Field conventions: see the header of data/curated/fauna-regions.yaml.
# Early Paleocene (Danian) recovery animal: absent before the impact; it appears at `recovery.appears_years`.
id: eoconodon
name: Eoconodon
species: [E. coryphaeus]
# mammal_small is the app's only mammal body plan; it is used here for a ~47 kg animal.
group: mammal_small
body_plan: quadruped
age:
  formation: Denver Fm (Corral Bluffs, Colorado); Nacimiento Fm (San Juan Basin, New Mexico); other Eoconodon species in the Puercan of Montana (PBDB)
  ma_range: [65.39, 65.03]
  latest_maastrichtian: false
  epoch: early Paleocene (Danian), Puercan land-mammal age
  note: >-
    Range: first find at Corral Bluffs (~65.39 Ma, GPTS 2012 age model) to the end of the San Juan Basin Pu3 faunas
    (65.03 Ma; Flynn et al. 2020).
regions: [hell-creek, south-laramidia]
size:
  length_m: {typical: 1.1, range: [1.0, 1.3], confidence: chosen, note: "head and body; scaled from a living mammal of similar mass (wolf); no skeleton-based length in our sources"}
  hip_height_m: 0.55
  hip_height_note: "estimated"
  mass_kg:
    value: 47
    range: [29, 77]
    source: lyson2019
    confidence: model
    note: >-
      Lyson et al. 2019: ~47 kg from one cranium (DMNH EPV.130976; cranial-size regression of Kirk et al. 2014,
      lower-upper estimates 28.7–77.4 kg; data S13). The heaviest mammal in their record.
appearance:
  integument: fur
  colour: unknown; the app uses a muted brown
  confidence: model
behaviour:
  group_size: {typical: [1, 1], confidence: chosen}
  diet: omnivore (Lyson et al. 2019)
  activity: [walk, roam, rest]
  speed_m_s: {walk: 1.0, max: 7.0, source: null, confidence: chosen}
abundance:
  hell-creek: {relative: 0.02, source: lyson2019, confidence: chosen, note: "ordinal rare; two specimens at Corral Bluffs (a cranium and a palate)"}
  south-laramidia: {relative: 0.02, source: pbdb, confidence: chosen, note: "ordinal rare; PBDB lists 9 Puercan occurrences of the genus in New Mexico and Utah"}
recovery:
  appears_years: 651000
  range_years: [592000, 651000]
  confidence: known
  source: lyson2019
  note: >-
    First record at Corral Bluffs: a cranium in river-channel sandstone 103.74 m above the boundary, 651 kyr after it
    on the GPTS 2012 age model and 592 kyr on the Clyde et al. 2016 model (Lyson et al. 2019, data S11). Lyson et al.
    group it with Taeniolabis as the large mammals that appear by ~700 kyr. The same timing is used for the San Juan
    Basin, where its exact first horizon is not checked.
sources: [lyson2019, clyde2016, fuentes2019, flynn2020, pbdb]
notes: >-
  The heaviest mammal in the Colorado record of the first million years after the impact: about 47 kg, roughly the
  weight of a large wolf. It probably ate both plants and animals, and it appears about 650,000 years after the
  asteroid struck.
