# Species card. Field conventions: see the header of data/curated/fauna-regions.yaml.
id: tyrannosaurus
name: Tyrannosaurus
species: [T. rex]
group: tyrannosaurid
body_plan: biped
age:
  formation: Hell Creek, Lance, Frenchman, Scollard Fms; North Horn (Utah) and Javelina (Texas) Fms
  ma_range: [68.0, 66.0]
  latest_maastrichtian: true
taxonomy:
  status: contested
  note: "Horner et al. 2011 treat Nanotyrannus as juvenile T. rex; this is debated. Two further proposed species (T. imperator, T. regina) are not followed here."
regions: [hell-creek, south-laramidia]
proxy_in: [arctic-beringia]
size:
  length_m: {typical: 12.0, range: [11.0, 13.0], confidence: model}
  hip_height_m: 3.0
  hip_height_note: "estimated from 'Sue' FMNH PR 2081 femur (1.32 m) + tibia (1.19 m) in the Benson 2014 data plus a metatarsus allowance, flexed posture"
  mass_kg:
    value: 7700
    range: [6000, 9500]
    source: benson2014
    confidence: model
    note: >-
      Benson 2014: 7,694 kg for 'Scotty' (RSM P2523.8). Hutchinson et al. 2011 (volumetric models): adults
      6,000–8,000 kg, 'Sue' perhaps ~9,500 kg.
appearance:
  integument: >-
    scaly: skin impressions from the neck, hips and tail are small pebbly scales (Bell et al. 2017); any feathers
    were at most limited to the back
  colour: unknown; the app uses a muted, countershaded palette
  confidence: known
  sources: [bell2017]
behaviour:
  group_size: {typical: [1, 1], confidence: model, note: "no T. rex group site is known (tyrannosaurid group sites are Campanian and of other genera)"}
  diet: carnivore (predator and scavenger)
  activity: [walk, roam, hunt, scavenge, rest]
  speed_m_s:
    walk: 1.28
    max: 5.4
    source: vanbijlert2021
    confidence: model
    note: >-
      Preferred walking speed 1.28 m/s (range 0.80–1.64) from tail natural frequency (van Bijlert et al. 2021).
      Sellers et al. 2017 found that bone strength limits adults to walking gaits (Froude number ~1 at
      physiological stress); 5.4 m/s is Froude 1 for a 3.0 m hip height (our calculation). Their unconstrained
      model peaked at 7.7 m/s.
  density_per_km2:
    value: 0.01
    source: marshall2021
    confidence: model
    note: "about one adult per 100 km²; the abundance estimate behind it (~20,000 adults alive at a time) has a 95 % interval of 1,300–328,000"
abundance:
  hell-creek: {relative: 0.24, source: horner2011, confidence: known, note: "24 % (n = 44) of large-dinosaur skeletons, a surprisingly high share for a predator"}
  south-laramidia: {relative: 0.08, source: sampson2005, confidence: chosen, note: "ordinal uncommon; present in the North Horn Fm"}
sources: [horner2011, benson2014, hutchinson2011, bell2017, sellers2017, vanbijlert2021, marshall2021, sampson2005, erickson2004, pbdb]
notes: >-
  T. rex was probably too big to run; its leg bones would have failed at a true running gait. It made up about a
  quarter of the large-dinosaur skeletons in the Hell Creek census, which suggests it fed on carcasses as well as
  live prey.
