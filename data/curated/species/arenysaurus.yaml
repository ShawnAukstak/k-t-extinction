# Species card. Field conventions: see the header of data/curated/fauna-regions.yaml.
id: arenysaurus
name: Arenysaurus
species: [A. ardevoli]
group: hadrosaur
body_plan: facultative_biped
age:
  formation: Tremp Group, Arén area (Huesca, Spain)
  ma_range: [67.0, 66.0]
  latest_maastrichtian: true
  note: "Upper Maastrichtian (Pereda-Suberbiola et al. 2009); hadrosaurs dominate the youngest dinosaur sites of the Pyrenees (Vila et al. 2016; Fondevilla et al. 2019)."
regions: [ibero-armorica]
proxy_in: [hateg, africa-interior]
size:
  length_m: {typical: 6.0, range: [5.0, 7.0], confidence: chosen, note: "partial skeleton; no published length in our sources"}
  hip_height_m: 1.6
  hip_height_note: "estimated from length using hadrosaur proportions"
  mass_kg:
    value: 1700
    source: benson2014
    confidence: chosen
    note: "Our scaling: the Benson 2014 value for the lambeosaurine Olorotitan (4,132 kg, ~8 m) scaled isometrically to 6 m."
appearance:
  integument: scaly; a lambeosaurine with a very prominent bony dome on the forehead (Pereda-Suberbiola et al. 2009)
  colour: unknown; the app uses a muted, countershaded palette
  confidence: model
behaviour:
  group_size: {typical: [3, 20], confidence: chosen, note: "hadrosaur trackways are the commonest dinosaur tracks in the latest Maastrichtian of the Pyrenees"}
  diet: herbivore (low-to-mid browser)
  activity: [graze, browse_low, walk, roam, rest]
  speed_m_s: {walk: 1.3, max: 7.0, source: null, confidence: chosen}
abundance:
  ibero-armorica: {relative: 0.40, source: vila2016, confidence: chosen, note: "ordinal abundant (hadrosaurs as a group)"}
sources: [pereda2009, vila2016, fondevilla2019, csikisava2015, pbdb]
notes: >-
  One of the last dinosaurs of Europe. Its relationships point to a land link between Asia and the European
  islands late in the Cretaceous (Pereda-Suberbiola et al. 2009).
