# Species card. Field conventions: see the header of data/curated/fauna-regions.yaml.
id: tarbosaurus
name: Tarbosaurus
species: [T. bataar]
group: tyrannosaurid
body_plan: biped
age:
  formation: Nemegt Fm (Mongolia); teeth referred to Tarbosaurus from the Udurchukan and Yuliangzi Fms (Amur region) and the Qiupa Fm (Henan)
  ma_range: [71.0, 68.0]
  latest_maastrichtian: false
  context_only: true
  why: >-
    The Nemegt Fm has no radiometric date and is usually placed in the early–middle Maastrichtian, a few Myr before
    the impact; shown as 'representative / older record' (D12). The late-Maastrichtian tooth records from the Amur
    region and China are identified only from teeth.
regions: [nemegt, east-asia]
size:
  length_m: {typical: 10.0, range: [8.5, 12.0], confidence: model}
  hip_height_m: 2.5
  hip_height_note: "estimated from femora 0.94–1.2 m and a 0.95 m tibia in the Benson 2014 data, flexed posture"
  mass_kg:
    value: 2300
    range: [2300, 4900]
    source: benson2014
    confidence: model
    note: >-
      Benson 2014: 2,345 kg for MPC-D 552/1 (femur 0.94 m). Larger femora (1.12–1.2 m) are listed; scaling
      isometrically to a 1.2 m femur gives ~4.9 t (our calculation).
appearance:
  integument: scaly (skin impressions; Bell et al. 2017)
  colour: unknown; the app uses a muted, countershaded palette
  confidence: known
  sources: [bell2017]
behaviour:
  group_size: {typical: [1, 1], confidence: chosen}
  diet: carnivore
  activity: [walk, roam, hunt, scavenge, rest]
  speed_m_s: {walk: 1.3, max: 6.0, source: null, confidence: chosen}
abundance:
  nemegt: {relative: 0.20, source: pbdb, confidence: chosen, note: "ordinal common; ~50 PBDB occurrences in the Nemegt Fm"}
  east-asia: {relative: 0.08, source: pbdb, confidence: chosen, note: "ordinal uncommon; teeth only"}
sources: [benson2014, bell2017, pbdb]
notes: >-
  T. rex's close Asian cousin, slightly smaller and lighter-built. It ruled the river forests of what is now the
  Gobi Desert a few million years before the impact.
