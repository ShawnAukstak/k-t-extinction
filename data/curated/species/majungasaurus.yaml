    note: "Benson 2014: 1,614 kg, estimated from FMNH PR 2278"
appearance:
  integument: scaly (skin of the related Carnotaurus is scaly; Hendrickx & Bell 2021); a single bony knob on the forehead
  colour: unknown; the app uses a muted, countershaded palette
  confidence: model
  sources: [hendrickx2021]
behaviour:
  group_size: {typical: [1, 1], confidence: chosen}
