# Fauna regions: where each species card (data/curated/species/*.yaml) lives on the 66 Ma globe (decision D11).
#
# FOOTPRINTS
#   paleo_center  {lat, lon} in the PALEOMAP 65 Ma frame, the same frame as the PaleoDEM terrain and the POIs (D2).
#   radius_km     great-circle radius of the region's disc. Regions with several separate fossil areas also list
#                 `subcenters` (each with its own radius); the app should treat the region as the union of the
#                 subcenter discs where they exist, and the big disc only as a coarse fallback.
#   Land regions apply to land cells and marine regions to sea cells; where discs overlap, the nearer centre wins.
#
#   How centres were computed (2026-10-11): from the PBDB Maastrichtian occurrence pulls in
#   data/raw/paleontology/pbdb/ (Dinosauria, marine reptiles, Crocodylomorpha + Choristodera + Testudines, Mammalia,
#   Pterosauria). PBDB's own paleocoordinates (`pla`/`pln`, pgm=scotese) are computed at the midpoint of each
#   record's age range (`ps1: mid`, ~69 Ma for most Maastrichtian records), which puts them 100–200 km (India ~490 km)
#   from the app's 65 Ma positions. So we reconstructed each unique collection's modern `lat`/`lng` to 65 Ma with
#   scripts/kt/plates.py (PALEOMAP v3, offline; it reproduces the POI positions, e.g. Tanis 51.674, -79.599), and
#   used PBDB's plate id (`gpl`) wherever our point-in-polygon lookup disagreed with it (6 Brazilian points landed on
#   the Pacific plate polygon; see the report). Centre = spherical mean of the unique collections in the region;
#   `n_collections`, `r50_km`/`r90_km` (half / 90 % of collections lie within) document each cluster. Radii are
#   chosen to cover ~90 % of collections plus a margin for the unsampled landscape around the outcrops. Regions with
#   no usable record (open ocean, African interior) use reconstructed reference points, as noted.
#
# FAUNA ENTRIES
#   species             id of a file in data/curated/species/
#   relative_abundance  0–1 weight, comparable only among entries of the same `guild` in the same region:
#                         land_large (adult > ~100 kg), land_small, freshwater, air, sea
#   basis               census  = measured share (Horner et al. 2011: skeletons of large dinosaurs, Hell Creek Fm)
#                       ordinal = our estimate on a fixed scale:
#                         abundant 0.40 · common 0.20 · uncommon 0.08 · rare 0.02 · very_rare 0.005
#   group               typical group size [min, max] (from the species card)
#   confidence          known | model | contested | chosen (decisions.md, factual-accuracy UX principle)
#   proxy_for           present when the species card stands in for a related animal that has no card of its own.
#                       The app may draw the proxy's model but the tooltip must name the real animals and say
#                       "stand-in: <card name>".
#   Records older than ~67 Ma are labelled per D12 ('representative / older record'): see each species card's
#   `age.context_only` / `age.why`, and the region's `latest_maastrichtian` / `record_age`.
#
# RECOVERY (EARLY PALEOCENE) ANIMALS
#   Cards with a `recovery` block are animals that were NOT there before the impact (fauna entries say "Paleocene").
#   recovery.appears_years  first record in the region, in years after the impact, on the published age model named
#                           in its note (Denver Basin: GPTS 2012, boundary at 66.04 Ma, the app's impact age)
#   recovery.range_years    the same horizon on the alternative age model (Clyde et al. 2016, boundary 66.021 Ma),
#                           or the stated dating / placement uncertainty
#   recovery.by_region      optional per-region override ({region id: same fields}) where that region's record
#                           starts at a different time (e.g. the San Juan Basin, Flynn et al. 2020)
#   A first find is the latest possible arrival; the animal may have been there somewhat earlier.
#
# Absolute densities are not set here. The app should derive them from body mass (Damuth scaling) and these
# relative weights; the one published absolute estimate is for T. rex (marshall2021; see tyrannosaurus.yaml).

regions:

  # ── Land ─────────────────────────────────────────────────────────────────────────────────────────────────────

  - id: hell-creek
    name: Northern Laramidia (Hell Creek, Lance, Frenchman, Scollard)
    kind: land
    # 620 PBDB collections (3,178 occurrences) in the Hell Creek, Lance, Frenchman, Scollard and Ferris Fms.
    # r50 208 km, r90 460 km, farthest 1,210 km (Scollard, Alberta). Tanis lies 142 km and the Hell Creek type
    # area 178 km from the centre.
    paleo_center: {lat: 51.98, lon: -81.61}
    radius_km: 1100
    n_collections: 620
    r50_km: 208
    r90_km: 460
    # Subcenters (added 2026-10-11 for the Paleocene recovery fauna). The Denver Basin lies 735 km from the centre,
    # inside both this disc and the south-laramidia disc, and the nearer-relative-centre rule put Corral Bluffs in
    # south-laramidia (0.65 vs 0.72). Its latest-Cretaceous Denver Fm fauna is the northern one (see south-laramidia
    # below) and its earliest Paleocene mammals are this region's, so it gets its own disc here. Positions:
    # PBDB collection coordinates reconstructed to 65 Ma with scripts/kt/plates.py (plate 101): Corral Bluffs DMNH
    # localities 44.94, -83.11; West Bijou 45.40, -82.91; Alexander 45.73, -83.03; South Table Mountain 45.71, -83.49;
    # centre = their spherical mean (all four within 57 km). The core disc repeats the region disc so the region keeps
    # its footprint if subcenters are ever used on their own.
    subcenters:
      - {name: "Hell Creek, Lance, Frenchman and Scollard Fms (core)", lat: 51.98, lon: -81.61, radius_km: 1100, n_collections: 620}
      - {name: "Denver Basin (Denver Fm: Corral Bluffs, West Bijou, South Table Mountain)", lat: 45.44, lon: -83.13, radius_km: 250, n_collections: 90, note: "PBDB Danian mammal collections in Colorado"}
    habitat: [floodplain, forest, swamp, river, coastal_plain]
    latest_maastrichtian: true
    record_age: latest Maastrichtian (C30n–C29r); the census and the bird fauna lie within ~300 kyr to ~2 Myr of the boundary
    confidence: known
    fauna:
      - {species: triceratops, relative_abundance: 0.40, basis: census, guild: land_large, group: [1, 3], confidence: known}
      - {species: tyrannosaurus, relative_abundance: 0.24, basis: census, guild: land_large, group: [1, 1], confidence: known, note: "skeleton share; may overstate living numbers"}
      - {species: edmontosaurus, relative_abundance: 0.20, basis: census, guild: land_large, group: [5, 40], confidence: known}
      - {species: thescelosaurus, relative_abundance: 0.08, basis: census, guild: land_large, group: [1, 2], confidence: known}
      - {species: ornithomimus, relative_abundance: 0.05, basis: census, guild: land_large, group: [1, 6], confidence: known}
      - {species: pachycephalosaurus, relative_abundance: 0.01, basis: census, guild: land_large, group: [1, 3], confidence: known}
      - {species: ankylosaurus, relative_abundance: 0.01, basis: census, guild: land_large, group: [1, 1], confidence: known}
      - {species: anzu, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_large, group: [1, 3], confidence: chosen, note: "not in the census; three partial skeletons from the Dakotas"}
      - {species: torosaurus, relative_abundance: 0.005, basis: ordinal, ordinal: very_rare, guild: land_large, group: [1, 2], confidence: contested, note: "counted as Triceratops by Horner et al. 2011"}
      - {species: acheroraptor, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 3], confidence: chosen}
      - {species: didelphodon, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_small, group: [1, 1], confidence: chosen}
      - {species: mesodma, relative_abundance: 0.40, basis: ordinal, ordinal: abundant, guild: land_small, group: [1, 4], confidence: chosen}
      - {species: basilemys, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 1], confidence: chosen}
      - {species: champsosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: freshwater, group: [1, 3], confidence: chosen}
      - {species: brachychampsa, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: freshwater, group: [1, 3], confidence: chosen}
      - {species: borealosuchus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: freshwater, group: [1, 3], confidence: chosen}
      - {species: avisaurus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: air, group: [1, 2], confidence: chosen}
      - {species: azhdarchid, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: air, group: [1, 8], confidence: chosen, note: "Infernodrakon"}
      # Early Paleocene recovery mammals (absent before the impact; timing in each card's `recovery` block).
      - {species: baioconodon, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 1], confidence: chosen, note: "Paleocene; from ~93 kyr after the impact (Denver Basin)"}
      - {species: purgatorius, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 2], confidence: chosen, note: "Paleocene; from ~139 kyr (Montana); under 1 kg, not drawn"}
      - {species: carsioptychus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_small, group: [1, 3], confidence: chosen, note: "Paleocene; from ~291 kyr; the commonest mammal at Corral Bluffs"}
      - {species: ectoconus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 2], confidence: chosen, note: "Paleocene; from ~417 kyr"}
      - {species: loxolophus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 1], confidence: chosen, note: "Paleocene; from ~509 kyr"}
      - {species: eoconodon, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 1], confidence: chosen, note: "Paleocene; from ~651 kyr"}
      - {species: taeniolabis, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 2], confidence: chosen, note: "Paleocene; from ~718 kyr; near rivers"}
    sources: [horner2011, pearson2002, archibald1990, wilson2013, holroyd2014, longrich2011, thomas2024, lyson2019, fuentes2019, krause2021, wilsonmantilla2021, pbdb]

  - id: south-laramidia
    name: Southern Laramidia (Javelina, Black Peaks, Ojo Alamo, North Horn; northern Mexico)
    kind: land
    # 131 PBDB collections (278 occurrences). r50 535 km, r90 801 km. The southern 'Alamosaurus fauna' and the
    # northern 'Triceratops fauna' do not split along one latitude: the North Horn Fm (Utah, 46.4°N at 65 Ma) has
    # Alamosaurus while the Denver Fm (45.7°N) has the northern fauna. Where this disc overlaps hell-creek, use the
    # nearer centre (the Denver Basin itself is a hell-creek subcenter).
    paleo_center: {lat: 39.83, lon: -86.98}
    radius_km: 1000
    n_collections: 131
    r50_km: 535
    r90_km: 801
    subcenters:
      - {name: "Big Bend (Javelina, Black Peaks Fms)", lat: 35.38, lon: -84.59, radius_km: 250, n_collections: 46}
      - {name: "San Juan Basin (Ojo Alamo Fm, Naashoibito Mb)", lat: 43.06, lon: -88.28, radius_km: 250, n_collections: 46}
      - {name: "Wasatch Plateau (North Horn Fm)", lat: 46.35, lon: -90.76, radius_km: 250, n_collections: 25}
    habitat: [floodplain, forest, river, upland]
    latest_maastrichtian: true
    record_age: late Maastrichtian (~69–66 Ma); the Naashoibito Mb and the upper Javelina Fm approach the boundary
    confidence: model
    fauna:
      - {species: alamosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [1, 6], confidence: chosen}
      - {species: tyrannosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 1], confidence: chosen}
      - {species: torosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 2], confidence: contested, note: "T. utahensis"}
      - {species: edmontosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [5, 30], confidence: chosen, proxy_for: "hadrosaurids of the Javelina and Ojo Alamo Fms (mostly unidentified to genus)"}
      - {species: ankylosaurus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_large, group: [1, 1], confidence: chosen, proxy_for: "nodosaurid ankylosaurs (e.g. Glyptodontopelta, Naashoibito Mb)"}
      - {species: ornithomimus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_large, group: [1, 6], confidence: chosen, proxy_for: "ornithomimids indet."}
      - {species: brachychampsa, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: freshwater, group: [1, 3], confidence: chosen, proxy_for: "crocodylians of the Javelina Fm"}
      - {species: quetzalcoatlus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: air, group: [1, 2], confidence: chosen}
      - {species: azhdarchid, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: air, group: [1, 8], confidence: chosen, note: "Quetzalcoatlus lawsoni, Wellnhopterus"}
      # Early Paleocene recovery mammals of the Nacimiento Fm (San Juan Basin) and North Horn Fm (Utah) (absent before
      # the impact; timing in each card's `recovery` block, with San Juan Basin overrides in `recovery.by_region`).
      # No mammals are known from San Juan Basin beds older than ~360 kyr after the impact (Flynn et al. 2020).
      - {species: ectoconus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_small, group: [1, 2], confidence: chosen, note: "Paleocene; from ~360 kyr (San Juan Basin Pu2)"}
      - {species: carsioptychus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 3], confidence: chosen, note: "Paleocene; from ~360 kyr (San Juan Basin Pu2)"}
      - {species: loxolophus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 1], confidence: chosen, note: "Paleocene; from ~509 kyr (Corral Bluffs timing)"}
      - {species: eoconodon, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 1], confidence: chosen, note: "Paleocene; from ~651 kyr (Corral Bluffs timing)"}
      - {species: taeniolabis, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_small, group: [1, 2], confidence: chosen, note: "Paleocene; from ~770 kyr (San Juan Basin Pu3)"}
    sources: [andres2021, fowler2011, sampson2005, benson2014, flynn2020, lyson2019, pbdb]

  - id: appalachia
    name: Appalachia (eastern North America)
    kind: land
    # 28 PBDB collections with dinosaurs (51 occurrences), all in marine or coastal rocks of New Jersey, Maryland,
    # the Carolinas and the Mississippi Embayment: carcasses washed out to sea. The interior has no record.
    # r50 204 km, r90 665 km.
    paleo_center: {lat: 39.43, lon: -54.51}
    radius_km: 900
    n_collections: 28
    r50_km: 204
    r90_km: 665
    habitat: [coastal_plain, forest, swamp]
    latest_maastrichtian: true
    record_age: Maastrichtian (New Egypt, Navesink, Hornerstown Fms); sparse
    confidence: chosen
    fauna:
      - {species: dryptosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 1], confidence: chosen}
      - {species: edmontosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [3, 20], confidence: chosen, proxy_for: "hadrosaurids indet. (the commonest Appalachian dinosaur remains)"}
      - {species: borealosuchus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: freshwater, group: [1, 3], confidence: chosen, proxy_for: "coastal crocodylians (e.g. Thoracosaurus)"}
    sources: [brusatte2011, pbdb]

  - id: arctic-beringia
    name: Arctic Alaska and Chukotka (polar forests)
    kind: land
    # Two clusters ~1,570 km apart: Prince Creek Fm, North Slope of Alaska (11 collections, 81.4°N at 65 Ma;
    # older, context) and Kakanaut Fm, Chukotka (2 collections, 72.8°N; late Maastrichtian per PBDB).
    # Centre = mean of the two clusters.
    paleo_center: {lat: 78.4, lon: -166.0}
    radius_km: 1300
    subcenters:
      - {name: "North Slope (Prince Creek Fm)", lat: 81.38, lon: -128.72, radius_km: 400, n_collections: 11, latest_maastrichtian: false}
      - {name: "Kakanaut Fm (Chukotka)", lat: 72.82, lon: 176.05, radius_km: 400, n_collections: 2, latest_maastrichtian: true}
    habitat: [polar_forest, floodplain, river]
    latest_maastrichtian: false
    record_age: mixed; most named taxa come from the Prince Creek Fm (late Campanian to ~70 Ma); Kakanaut is late Maastrichtian but fragmentary
    confidence: chosen
    fauna:
      - {species: edmontosaurus, relative_abundance: 0.40, basis: ordinal, ordinal: abundant, guild: land_large, group: [5, 40], confidence: chosen, note: "Edmontosaurus at Prince Creek (context); hadrosaurids indet. at Kakanaut"}
      - {species: triceratops, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 5], confidence: chosen, proxy_for: "Pachyrhinosaurus perotorum (centrosaurine; Prince Creek Fm, older record)"}
      - {species: tyrannosaurus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_large, group: [1, 1], confidence: chosen, proxy_for: "smaller tyrannosaurids (Nanuqsaurus, Prince Creek Fm; teeth at Kakanaut)"}
    sources: [pbdb]

  - id: ibero-armorica
    name: Ibero-Armorican island (Iberia and southern France)
    kind: land
    # 345 PBDB collections (757 occurrences) in Spain, France and Portugal; r50 85 km, r90 301 km; the Tremp basin
    # (south-central Pyrenees) alone has 150 collections.
    paleo_center: {lat: 35.21, lon: -0.04}
    radius_km: 600
    n_collections: 345
    r50_km: 85
    r90_km: 301
    subcenters:
      - {name: "Tremp basin (south-central Pyrenees)", lat: 34.61, lon: -0.47, radius_km: 200, n_collections: 150}
    habitat: [floodplain, forest, coast, lagoon]
    latest_maastrichtian: true
    record_age: latest Maastrichtian in the Tremp Group (dinosaurs persist into chron C29r); southern France mostly older
    confidence: model
    fauna:
      - {species: arenysaurus, relative_abundance: 0.40, basis: ordinal, ordinal: abundant, guild: land_large, group: [3, 20], confidence: chosen, note: "hadrosaurs as a group"}
      - {species: ampelosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 6], confidence: chosen, note: "older record standing in for the undiagnostic latest-Maastrichtian titanosaurs"}
      - {species: majungasaurus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_large, group: [1, 1], confidence: chosen, proxy_for: "abelisauroid theropods (isolated teeth)"}
      - {species: borealosuchus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: freshwater, group: [1, 3], confidence: chosen, proxy_for: "allodaposuchid crocodylians (e.g. Allodaposuchus, Arenysuchus)"}
      - {species: azhdarchid, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: air, group: [1, 8], confidence: chosen}
    sources: [vila2016, fondevilla2019, pereda2009, vila2022, csikisava2015, pbdb]

  - id: hateg
    name: Hațeg Island (Transylvania, Romania)
    kind: land
    # 86 PBDB collections (383 occurrences); r50 34 km, r90 54 km. The island was ~80,000 km² (a disc of radius
    # ~160 km), so the radius is set by the island, not the outcrop.
    paleo_center: {lat: 33.81, lon: 20.31}
    radius_km: 200
    n_collections: 86
    r50_km: 34
    r90_km: 54
    habitat: [floodplain, forest, river]
    latest_maastrichtian: false
    record_age: mostly early Maastrichtian (~72–69 Ma); 'representative / older record' (D12)
    confidence: model
    fauna:
      - {species: magyarosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [1, 6], confidence: chosen}
      - {species: thescelosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [1, 4], confidence: chosen, proxy_for: "Zalmoxes (rhabdodontid ornithopod, ~120–190 kg)"}
      - {species: arenysaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 6], confidence: chosen, proxy_for: "Telmatosaurus (small, early hadrosauroid)"}
      - {species: acheroraptor, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 2], confidence: chosen, proxy_for: "Balaur (dromaeosaurid)"}
      - {species: mesodma, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_small, group: [1, 4], confidence: chosen, proxy_for: "kogaionid multituberculates"}
      - {species: quetzalcoatlus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: air, group: [1, 2], confidence: chosen, proxy_for: "Hatzegopteryx (giant, robust azhdarchid)"}
    sources: [csikisava2015, stein2010, benson2014, pbdb]

  - id: south-america
    name: South America
    kind: land
    # 327 PBDB collections (688 occurrences); r50 1,045 km, r90 2,201 km. Three main clusters below; scattered
    # records in Uruguay, Chile, Peru, Colombia and Ecuador.
    paleo_center: {lat: -36.88, lon: -52.57}
    radius_km: 2500
    n_collections: 327
    r50_km: 1045
    r90_km: 2201
    subcenters:
      - {name: "northern Patagonia (Allen, Los Alamitos, La Colonia Fms)", lat: -44.30, lon: -56.55, radius_km: 500, n_collections: 165}
      - {name: "Bauru Basin (Marília / Serra da Galga Fms)", lat: -23.30, lon: -35.75, radius_km: 500, n_collections: 38}
      - {name: "Andean basins (El Molino Fm, Bolivia)", lat: -21.35, lon: -53.22, radius_km: 400, n_collections: 56}
    habitat: [floodplain, forest, semi_arid, coast]
    latest_maastrichtian: false
    record_age: mostly late Campanian–early Maastrichtian; latest-Maastrichtian vertebrates are fragmentary
    confidence: chosen
    note: "Tropical South American forests were open-canopy and conifer-bearing before the impact (Carvalho et al. 2021)."
    fauna:
      - {species: saltasaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [2, 10], confidence: chosen, note: "older record standing in for titanosaurs generally"}
      - {species: carnotaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 1], confidence: chosen, note: "abelisaurids generally"}
      - {species: edmontosaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [3, 20], confidence: chosen, proxy_for: "saurolophine hadrosaurs of the Allen Fm (e.g. Bonapartesaurus)"}
      - {species: mesodma, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_small, group: [1, 4], confidence: chosen, proxy_for: "gondwanatherian and meridiolestidan mammals"}
      - {species: avisaurus, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: air, group: [1, 2], confidence: chosen, proxy_for: "avisaurid enantiornithines (e.g. Soroavisaurus)"}
    sources: [benson2014, hendrickx2021, clark2024, carvalho2021, pbdb]

  - id: africa-interior
    name: Continental Africa
    kind: land
    # Almost no latest-Maastrichtian land record. The best animals come from marine phosphates in Morocco, where
    # carcasses washed into the sea. Centre = modern (5°N, 20°E) reconstructed on plate 701 to 65 Ma; radius covers
    # the continent. Note: the offline plate model mis-assigns some West African points (e.g. near Accra) to the
    # Pacific plate (901); see the report.
    paleo_center: {lat: -6.4, lon: 12.4}
    radius_km: 3800
    habitat: [forest, floodplain, coastal_plain]
    latest_maastrichtian: true
    record_age: latest Maastrichtian (Morocco, Couche III) but very sparse
    confidence: chosen
    fauna:
      - {species: rapetosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [1, 6], confidence: chosen, proxy_for: "titanosaurs indet."}
      - {species: majungasaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 1], confidence: chosen, proxy_for: "Chenanisaurus barbaricus (abelisaurid, late Maastrichtian, Morocco)"}
