  - id: madagascar
    name: Madagascar
    kind: land
    # All 84 PBDB collections are in the Maevarano Fm, Mahajanga Basin (centre -28.62, 38.31; r90 49 km). The
    # region centre is the island's centre, modern (19°S, 46.7°E) reconstructed to 65 Ma; radius covers the island.
    paleo_center: {lat: -31.7, lon: 38.6}
    radius_km: 800
    n_collections: 84
    subcenters:
      - {name: "Mahajanga Basin (Maevarano Fm)", lat: -28.62, lon: 38.31, radius_km: 150, n_collections: 84}
    habitat: [floodplain, river, semi_arid]
    latest_maastrichtian: true
    record_age: Maastrichtian (Anembalemba Mb, usually treated as late Maastrichtian; not radiometrically dated)
    confidence: model
    note: "A strongly seasonal, drought-prone setting (Curry Rogers et al. 2016)."
    fauna:
      - {species: rapetosaurus, relative_abundance: 0.20, basis: ordinal, ordinal: common, guild: land_large, group: [1, 6], confidence: chosen}
      - {species: majungasaurus, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: land_large, group: [1, 1], confidence: chosen}
      - {species: beelzebufo, relative_abundance: 0.08, basis: ordinal, ordinal: uncommon, guild: freshwater, group: [1, 1], confidence: chosen}
      - {species: mesodma, relative_abundance: 0.02, basis: ordinal, ordinal: rare, guild: land_small, group: [1, 2], confidence: chosen, proxy_for: "gondwanatherian mammals (e.g. Vintana, Adalatherium)"}
    sources: [rogers2003, curryrogers2016, evans2008, benson2014, pbdb]

