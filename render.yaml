# Render Blueprint: the app as a static site, rebuilt on every push to main.
# The generated data is not in git; the build fetches the bundle named in app/data-bundle.json from this
# repo's releases (app/tools/render-build.sh), which needs GH_DATA_TOKEN: a fine-grained GitHub token
# with read-only "Contents" access to this repository. Render asks for it when the Blueprint is created.
services:
  - type: web
    runtime: static
    name: k-t-extinction
    branch: main
    buildCommand: bash app/tools/render-build.sh
    staticPublishPath: app/dist
    envVars:
      - key: GH_DATA_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      # Hashed bundles never change; data files can, so cache them for an hour.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
